<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/ https://challenges.cloudflare.com; connect-src 'self' https://txdubkiyaceyassjcizc.supabase.co wss://txdubkiyaceyassjcizc.supabase.co; frame-src https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>NIT – ניהול העסק</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="owner.css">
</head>
<body>
  <header class="top">
    <h1>NIT <span>ניהול העסק</span></h1>
    <p class="biz" id="biz-name"></p>
    <div class="top-row">
      <p class="demo-badge" id="who"></p>
      <button class="btn link hidden" id="logout">התנתקות</button>
    </div>
    <div class="tabs-wrap hidden" id="tabs-wrap">
      <button type="button" class="tabs-more" id="tabs-more" aria-label="לשוניות נוספות">עוד</button>
      <nav id="tabs" class="tabs" role="tablist" aria-label="ניווט לוח הבקרה">
        <button type="button" role="tab" id="tab-calendar" data-tab="calendar" aria-controls="view-calendar" aria-selected="true" tabindex="0">יומן</button>
        <button type="button" role="tab" id="tab-staff" data-tab="staff" aria-controls="view-staff" aria-selected="false" tabindex="-1">צוות</button>
        <button type="button" role="tab" id="tab-services" data-tab="services" aria-controls="view-services" aria-selected="false" tabindex="-1">שירותים</button>
        <button type="button" role="tab" id="tab-hours" data-tab="hours" aria-controls="view-hours" aria-selected="false" tabindex="-1">שעות והפסקות</button>
        <button type="button" role="tab" id="tab-days" data-tab="days" aria-controls="view-days" aria-selected="false" tabindex="-1">ימים מיוחדים</button>
        <button type="button" role="tab" id="tab-waitlist" data-tab="waitlist" aria-controls="view-waitlist" aria-selected="false" tabindex="-1">רשימת המתנה</button>
        <button type="button" role="tab" id="tab-settings" data-tab="settings" aria-controls="view-settings" aria-selected="false" tabindex="-1">הגדרות</button>
      </nav>
    </div>
  </header>

  <div id="setup-banner" class="setup-banner hidden" role="region" aria-label="השלמת הגדרה"></div>

  <main>
    <section id="view-loading" class="view"><div class="card"><p class="muted">טוען…</p></div></section>

    <section id="view-login" class="view hidden"><div class="card login">
      <h2>כניסה לבעלי עסקים</h2>
      <button class="btn google" id="login-google" type="button">כניסה עם Google</button>
      <p class="or">או בקוד חד-פעמי למייל</p>
      <form id="otp-email-form">
        <label>מייל <input name="email" type="email" required autocomplete="email" dir="ltr"></label>
        <div id="captcha" class="captcha"></div>
        <button class="btn primary" type="submit">שלחו לי קוד</button>
      </form>
      <form id="otp-code-form" class="hidden">
        <p class="muted" id="otp-sent"></p>
        <label>קוד <input name="token" required inputmode="numeric" pattern="[0-9]{6,8}" maxlength="8" autocomplete="one-time-code" dir="ltr"></label>
        <div class="actions">
          <button class="btn ghost" type="button" id="otp-back">מייל אחר</button>
          <button class="btn primary" type="submit">כניסה</button>
        </div>
      </form>
      <p class="form-error" id="login-error" role="alert"></p>
    </div></section>

    <section id="view-nobiz" class="view hidden"><div class="card" id="nobiz-card">
      <h2>אין עסק משויך לחשבון הזה</h2>
      <p class="muted">כדי לנהל יומן צריך הזמנה מבעל עסק קיים, או פתיחת עסק חדש.</p>
      <div class="actions nobiz-actions">
        <button type="button" class="btn primary" id="nobiz-create">פתיחת עסק חדש</button>
        <button type="button" class="btn" id="nobiz-refresh">יש לי הזמנה — רענון</button>
        <button type="button" class="btn link" id="nobiz-logout">התנתקות</button>
      </div>
      <p class="form-error hidden" id="nobiz-error" role="alert"></p>
    </div></section>

    <section id="view-onboard" class="view hidden"></section>

    <section id="view-calendar" class="view tab-view hidden" role="tabpanel" aria-labelledby="tab-calendar" tabindex="0"></section>
    <section id="view-staff" class="view tab-view hidden" role="tabpanel" aria-labelledby="tab-staff" tabindex="0"></section>
    <section id="view-services" class="view tab-view hidden" role="tabpanel" aria-labelledby="tab-services" tabindex="0"></section>
    <section id="view-hours" class="view tab-view hidden" role="tabpanel" aria-labelledby="tab-hours" tabindex="0"></section>
    <section id="view-days" class="view tab-view hidden" role="tabpanel" aria-labelledby="tab-days" tabindex="0"></section>
    <section id="view-waitlist" class="view tab-view hidden" role="tabpanel" aria-labelledby="tab-waitlist" tabindex="0"></section>
    <section id="view-settings" class="view tab-view hidden" role="tabpanel" aria-labelledby="tab-settings" tabindex="0"></section>
  </main>

  <dialog id="appt-dialog"><form method="dialog" id="appt-form"></form></dialog>
  <dialog id="svc-confirm" aria-labelledby="svc-confirm-title">
    <form method="dialog" class="svc-confirm-form">
      <h2 id="svc-confirm-title">מחיקת שירות?</h2>
      <p id="svc-confirm-body" class="muted"></p>
      <div class="actions">
        <button type="submit" class="btn ghost" value="no">לא</button>
        <button type="submit" class="btn danger" value="yes">כן, מחקו</button>
      </div>
    </form>
  </dialog>
  <dialog id="danger-confirm" aria-labelledby="danger-confirm-title">
    <form method="dialog" class="danger-confirm-form">
      <h2 id="danger-confirm-title">ביטול התור?</h2>
      <p id="danger-confirm-body" class="muted"></p>
      <div class="actions">
        <button type="submit" class="btn ghost" value="no">לא</button>
        <button type="submit" class="btn danger" id="danger-confirm-yes" value="yes">כן, בטל</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer class="foot">NIT · ממשק ניהול. הגישה רק לחברי העסק.</footer>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
