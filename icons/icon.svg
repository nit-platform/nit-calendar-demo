<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NIT">
  <title>NIT</title>
  <!-- Full-bleed brand blue -->
  <rect width="512" height="512" rx="96" fill="#1D6FD8"/>
  <!-- Soft calendar glyph, white, centered -->
  <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calendar body -->
    <rect x="118" y="148" width="276" height="246" rx="36"/>
    <!-- Top binding -->
    <path d="M118 212 H394"/>
    <!-- Rings -->
    <path d="M198 120 V176"/>
    <path d="M314 120 V176"/>
  </g>
  <!-- Soft rounded dots as date marks -->
  <circle cx="198" cy="278" r="22" fill="#FFFFFF"/>
  <circle cx="256" cy="278" r="22" fill="#FFFFFF"/>
  <circle cx="314" cy="278" r="22" fill="#FFFFFF"/>
  <circle cx="198" cy="336" r="22" fill="#FFFFFF"/>
  <circle cx="256" cy="336" r="22" fill="#FFFFFF" opacity="0.45"/>
</svg>
