<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>NIT – אין חיבור</title>
  <style>
    :root { --bg:#f6f4f0; --brand:#1f3a5f; --ink:#1d1d1f; --muted:#6b6b70; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; text-align:center; }
    .card { background:#fff; border-radius:14px; padding:28px 22px; max-width:360px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    h1 { margin:0 0 8px; font-size:1.25rem; color:var(--brand); }
    p { margin:0 0 16px; color:var(--muted); line-height:1.45; }
    button { font:inherit; border:0; border-radius:10px; padding:12px 18px; background:var(--brand); color:#fff; cursor:pointer; min-height:44px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>אין חיבור לרשת</h1>
    <p>אפשר לפתוח את מעטפת האפליקציה, אבל הזמנת תור דורשת חיבור. בדקו את הרשת ונסו שוב.</p>
    <button type="button" onclick="location.reload()">נסו שוב</button>
  </div>
</body>
</html>
