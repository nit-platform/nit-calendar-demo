<!doctype html>
<html lang="he" dir="rtl" data-theme="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D6FD8">
  <title>NIT – אין חיבור</title>
  <style>
    :root { --bg:#F5F8FC; --brand:#1D6FD8; --ink:#0F172A; --muted:#475569; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
      font-family: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; text-align:center; }
    .card { background:#fff; border-radius:20px; padding:28px 22px; max-width:360px; box-shadow:0 4px 16px rgba(15,23,42,.08); border:1px solid #C9D7EA; }
    h1 { margin:0 0 8px; font-size:1.25rem; color:var(--brand); font-weight:600; }
    p { margin:0 0 16px; color:var(--muted); line-height:1.45; }
    button { font:inherit; border:0; border-radius:999px; padding:12px 18px; background:var(--brand); color:#fff; cursor:pointer; min-height:44px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>אין חיבור לרשת</h1>
    <p>אפשר לפתוח את מעטפת האפליקציה, אבל הזמנת תור דורשת חיבור. בדקו את הרשת ונסו שוב.</p>
    <button type="button" onclick="location.reload()">נסו שוב</button>
  </div>
</body>
</html>
